name: 10-Minute IoT Laundry Monitor Crawler

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [crawl]

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Taipei'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Crawler & Update Analysis
        run: |
          node backend/collector.js
          node backend/export_data.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/laundry.db frontend/public/data/
          if git diff --staged --quiet; then
            echo "No changes in machine data. Skipping commit."
          else
            git commit -m "chore(data): auto-update laundry status & history"
            git push
          fi
